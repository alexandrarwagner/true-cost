name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:constants
      - run: npm run check:deals

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          retention-days: 1
          include-hidden-files: true

  e2e:
    name: End-to-end (DEMO_MODE)
    runs-on: ubuntu-latest
    needs: build
    env:
      DEMO_MODE: "true"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - run: npx playwright install --with-deps chromium
      - run: node scripts/build-engine.mjs
      - run: npm run test:e2e -- --pass-with-no-tests
      - name: Lighthouse (phone profile, gated at 90)
        run: |
          npm run start &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health >/dev/null && break; sleep 2; done
          npm run perf
      # The runner's own capture of the designer's page: the first run on a new platform has no
      # baseline, so this is what gets committed as design/reference/screens-served/linux.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-screens-served
          path: design/reference/screens-served
          retention-days: 14
      # When a baseline is stale, Playwright writes the runner's capture next to a diff under
      # test-results; the *-actual.png files become the new Linux baseline.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results
          path: test-results
          retention-days: 7
          if-no-files-found: ignore
      # Only the runner's captures, without traces: a few hundred KB to fetch on a slow line.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-actuals
          path: test-results/**/*-actual.png
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lighthouse-reports
          path: .lighthouse
          retention-days: 7
          include-hidden-files: true

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm audit --audit-level=high
